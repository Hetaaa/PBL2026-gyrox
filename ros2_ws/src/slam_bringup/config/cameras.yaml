camera_defaults: &camera_defaults
  depth_module.emitter_enabled: 1  # 0=OFF (outdoor default), 1=ON (indoor/overcast)

  # [1] 848x480 — optymalna rozdzielczość dla D435/D435i/D455 wg Intel whitepaper
  # [2] 15fps — wystarczające dla łazika, stabilizuje temporal_filter

  ## Todo do zmiany na usb 3.1
  depth_module.depth_profile: "848x480x15"
  depth_module.infra_profile: "848x480x15"
  rgb_camera.color_profile: "848x480x15"

  # Enable/disable streams
  enable_depth: true
  enable_color: true
  enable_infra1: false
  enable_infra2: false
  enable_infra: false
  enable_gyro: false
  enable_accel: false
  pointcloud.enable: true
  enable_sync: true
  align_depth.enable: true

  # Frame IDs
  base_frame_id: "link"
  publish_tf: true
  tf_publish_rate: 0.0

  # Device settings
  # [3] clip_distance ustawiany per-kamera (patrz sekcje camera1/camera2)
  clip_distance: -1.0          # nadpisywane przez każdą kamerę
  initial_reset: true
  reconnect_timeout: 6.0
  wait_for_device_timeout: -1.0
  diagnostics_period: 0.0
  hold_back_imu_for_frames: false  # [6] false — jedyne bezpieczne ustawienie
  unite_imu_method: 0
  linear_accel_cov: 0.01
  angular_velocity_cov: 0.01

  # Eliminuje kolejkowanie przy chwilowych dropach USB (krytyczne przy 2 kamerach)
  depth_qos: "SENSOR_DATA"
  color_qos: "SENSOR_DATA"
  infra_qos: "SENSOR_DATA"
  infra1_qos: "SENSOR_DATA"
  infra2_qos: "SENSOR_DATA"
  imu_qos: "SENSOR_DATA"

  # Emitter IR — KLUCZOWE dla outdoors:
  # Outdoors w słońcu z bogatą teksturą (trawa, kamienie): ustaw 0 (OFF)
  # Zachmurzenie / szara gleba bez tekstury: ustaw 1 (ON)
  # Emitter ze wzorkiem plamkowym zakłóca odometrię wizualną RTAB-Map!
  # Stereo IR działa outdoors LEPIEJ bez emittera (natural texture wystarczy).
  # Zmień ręcznie lub użyj ros2 param set po uruchomieniu.


filter_defaults: &filter_defaults
  decimation_filter.enable: false   # Intel zaleca decimation po stronie aplikacji

  spatial_filter.enable: true
  spatial_filter.magnitude: 2          # iteracje (1-5)
  # [11] 4px zamiast 2px — outdoors więcej dziur (trawa, silhouettes, kamienie)
  spatial_filter.holes_fill: 2         # 0=off, 1=2px, 2=4px, 3=8px, 4=16px, 5=all

  temporal_filter.enable: true
  # [12] tryb 1 zamiast 3 — bardziej responsywny dla dynamicznego terenu
  # Tryb 1 = "valid in 2/last 2" — reaguje na nagłe przeszkody (kamienie, dziury)
  # Tryb 3 = "valid in 2/last 4" — za wolny dla poruszającego się łazika outdoors
  temporal_filter.persistence_control: 1

  hole_filling_filter.enable: false    # spatial_filter obsługuje hole filling
  disparity_filter.enable: false

cameras:
  # ---------------------------------------------------------------------------
  # D435i — odometria stereo IR + IMU (VIO)
  # Rola: dostarcza odometrię wizualno-inercyjną do RTAB-Map
  # Topiki do RTAB-Map: /camera1/infra1 + /infra2 (stereo) + /imu/data (IMU)
  # Tryb RTAB-Map: subscribe_stereo=true + wait_imu_to_init=true
  # ---------------------------------------------------------------------------
  camera1:
    enabled: true
    serial_number: "_213322070691"
    device_type: "D435I"
    ros__parameters:
      <<: [*camera_defaults, *filter_defaults]

      # Tryb stereo IR: oba strumienie IR aktywne
      enable_infra1: true
      enable_infra2: true
      # IMU — wymagane do VIO (Visual-Inertial Odometry)
      enable_gyro: true
      enable_accel: true
      # [5] linear_interpolation — Madgwick sam oblicza orientation z raw data
      unite_imu_method: 1
      
      # [3] D435i: zakres użyteczny ~0.3-3m, obcinamy przy 6m
      # Głębszy zakres to tylko szum który zaśmieca mapę terenu
      clip_distance: 6.0