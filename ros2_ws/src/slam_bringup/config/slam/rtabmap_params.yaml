rtabmap:
  ros__parameters:

    # --- Konfiguracja bazowa ---
    map_frame_id: 'map'
    frame_id: 'base_link'
    odom_frame_id: 'odom'

    subscribe_depth: false
    subscribe_rgbd: true
    subscribe_rgb: false
    subscribe_odom_info: true

    approx_sync: true
    publish_tf: true

    # --- CUDA (WYMUSZENIE GPU - HARD FAIL jeśli brak) ---
    Vis/Gpu: "true"
    Stereo/Gpu: "true"
    Vis/CorNNType: "3"          # GPU brute-force matcher (wymusza CUDA)

    # --- ODOMETRIA (KLUCZOWE) ---
    Reg/Strategy: "2"           # VisICP
    Vis/EstimationType: "0"     # 3D-3D
    Icp/Strategy: "1"           # point-to-plane
    Icp/Iterations: "15"

    Odom/GuessMotion: "true"
    RGBD/UseIMU: "true"

    # --- FEATURE EXTRACTION (POPRAWIONE) ---
    Vis/FeatureType: "6"        # ORB (stabilniejsze niż GFTT/BRIEF)
    Kp/MaxFeatures: "1200"

    # --- KEYFRAME CONTROL (DLA 1 m/s) ---
    RGBD/LinearUpdate: "0.05"
    RGBD/AngularUpdate: "0.03"

    # --- LOOP CLOSURE / MAPA ---
    Optimizer/Strategy: "1"

    RGBD/OptimizeMaxError: "3.0"
    RGBD/ProximityBySpace: "true"
    RGBD/ProximityMaxGraphDepth: "100"

    # --- PAMIĘĆ (POPRAWIONE) ---
    Mem/STMSize: "40"
    Mem/RehearsalSimilarity: "0.65"

    # --- WIZJA (OUTDOOR STABILNOŚĆ) ---
    Vis/MinInliers: "20"
    Vis/InlierDistance: "0.1"

    # --- GRID MAP (Nav2) ---
    Grid/Sensor: "1"
    Grid/CellSize: "0.05"
    Grid/MaxObstacleHeight: "1.5"
    Grid/MaxGroundHeight: "0.1"

    Grid/RangeMax: "4.0"
    Grid/RangeMin: "0.3"

    Grid/RayTracing: "true"
    Grid/DepthDecimation: "2"

    # --- WYDAJNOŚĆ (POPRAWIONE) ---
    Rtabmap/DetectionRate: "1.0"